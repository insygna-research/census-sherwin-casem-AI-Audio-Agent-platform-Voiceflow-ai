[tool.poetry]
name = "voiceflow"
version = "1.0.0"
description = "AI-powered voice call center agent"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "voiceflow", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
websockets = "^12.0"
twilio = "^8.11.0"
langchain = "^0.1.4"
langchain-anthropic = "^0.1.1"
openai = "^1.10.0"
elevenlabs = "^0.2.27"
redis = {extras = ["hiredis"], version = "^5.0.1"}
sqlalchemy = "^2.0.25"
psycopg2-binary = "^2.9.9"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
httpx = "^0.26.0"
alembic = "^1.13.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.7.0"
pytest-cov = "^4.1.0"

[tool.poetry.scripts]
voiceflow = "voiceflow.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
